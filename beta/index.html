<!doctype html><html><head><meta charset=utf8><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#1d7560"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="어항 일지"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-180.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>어항 일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 한 열 기록장(넓은 화면은 2열). 상단 어항 선택, 하단 탭, 기록 버튼. 색·테마는 설정에서 바꾸며 JS가 :root 토큰을 덮어씀. */
:root{
  --bg:#edf2f0; --surface:#ffffff; --sunk:#e3ebe8; --ink:#13302b; --muted:#556c66; --line:#cfdcd7;
  --accent:#1d7560; --accent-ink:#ffffff;
  --ok:#2c8a4b; --warn:#b26510; --bad:#b3362f; --none:#cfdcd7;
  --f-display:"Gowun Batang", "Nanum Myeongjo", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:12px; --fs:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1715; --surface:#13211e; --sunk:#0f1c19; --ink:#e0ece8; --muted:#93aaa3; --line:#27423b;
  --accent:#5cc3a5; --accent-ink:#06231c; --ok:#5fc27f; --warn:#e2a04a; --bad:#ef7b72; --none:#27423b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1715; --surface:#13211e; --sunk:#0f1c19; --ink:#e0ece8; --muted:#93aaa3; --line:#27423b;
  --accent:#5cc3a5; --accent-ink:#06231c; --ok:#5fc27f; --warn:#e2a04a; --bad:#ef7b72; --none:#27423b; color-scheme:dark}
html{font-size:calc(16px * var(--fs))}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 140px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-size:1.5rem;margin:0;letter-spacing:-.01em;line-height:1.2}
.brand .date{font-size:.8rem;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:2.5rem;height:2.5rem;display:grid;place-items:center}
.iconbtn svg{width:1.3rem;height:1.3rem;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapy{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.35rem .85rem;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:.75rem;opacity:.7}
main{display:grid;gap:18px;padding-top:16px}
h2.sec{font-family:var(--f-display);font-size:1.2rem;margin:0;line-height:1.3}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:.45rem .85rem;font-size:.95rem}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.sm{padding:.25rem .6rem;font-size:.85rem}
.btn.danger{color:var(--bad)}
.btn.link{border:none;background:none;padding:0;color:var(--accent);font-weight:600}
.back{border:none;background:none;padding:0;color:var(--muted);font-weight:600;font-size:.9rem}
.banner{border:1.5px solid var(--warn);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.banner>b{color:var(--warn)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.grid2{display:grid;gap:18px}
@media(min-width:900px){.grid2.cal2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}.grid2.tanks{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}

/* tank card */
.tank-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tank-head h3{margin:0;font-family:var(--f-display);font-size:1.35rem;line-height:1.25}
.tank-emoji{width:2.4rem;height:2.4rem;border-radius:10px;display:grid;place-items:center;font-size:1.4rem;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:10px;padding:10px;display:grid;gap:0;min-width:0;border:none;text-align:left}
.stat:hover{outline:1px solid var(--line)}
.stat .v{font-family:var(--f-mono);font-size:1.25rem;font-weight:500;font-variant-numeric:tabular-nums}
.stat .k{font-size:.8rem;color:var(--muted)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:.35rem .7rem;font-size:.9rem;display:inline-flex;gap:5px;align-items:center}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;gap:5px;align-items:baseline;border:1px solid var(--line);border-radius:7px;padding:.1rem .5rem;font-size:.9rem}
.pill.ok{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.bad{border-color:var(--bad);color:var(--bad);font-weight:600}
.dots5{display:inline-flex;gap:3px;vertical-align:middle}
.dots5 i{width:.55rem;height:.55rem;border-radius:50%;background:var(--line)}
.dots5 i.on{background:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;align-items:start}
.kv dd{margin:0;min-width:0}
.dtlink{border:none;background:none;padding:.3rem 0;color:var(--muted);font-size:.9rem;font-weight:600;display:inline-flex;gap:3px;align-items:center;white-space:nowrap}
.dtlink:hover{color:var(--accent)}
.dtlink span{opacity:.6}
.ddedit{width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:.25rem .45rem;margin-left:-.45rem;display:flex;gap:8px;justify-content:space-between;align-items:flex-start;overflow-wrap:anywhere}
.ddedit:hover,.ddedit:focus-visible{background:var(--sunk);border-color:var(--line)}
.ddedit .pen{color:var(--muted);opacity:.5;font-size:.85rem;flex:none}
.ddedit.add{color:var(--accent);font-weight:600}
.dt-plain{color:var(--muted);font-size:.9rem;font-weight:600;padding:.3rem 0}

/* entries */
.tl{display:grid;gap:8px}
.daygroup{display:grid;gap:6px}
.daygroup>.d{font-size:.85rem;color:var(--muted);font-weight:600;padding-top:8px}
.entry{display:grid;grid-template-columns:2.2rem 1fr;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%;align-items:start}
.entry.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.entry .ic{width:2.2rem;height:2.2rem;border-radius:9px;display:grid;place-items:center;font-size:1.15rem}
.entry.sel .ic{background:var(--accent)!important;color:var(--accent-ink)}
.entry .body{display:grid;gap:2px;min-width:0}
.entry .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem}
.entry .t .lb{font-weight:600}
.entry .sum{overflow-wrap:anywhere}
.entry .memo{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere;white-space:pre-line}
.ai-note{font-size:.85rem;overflow-wrap:anywhere}
.ai-out{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);border-radius:10px;padding:12px 14px;line-height:1.7;min-height:4rem}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--sunk)}
.bulkbar{position:sticky;bottom:calc(4.6rem + env(safe-area-inset-bottom,0px));z-index:15;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bulkbar select,.bulkbar .btn{background:var(--bg);color:var(--ink);border:1px solid var(--bg);border-radius:8px;padding:.3rem .5rem;font-size:.85rem}
.bulkbar .btn.danger{color:var(--bad)}

/* history */
.hist-title{display:flex;align-items:center;gap:10px}
.hist-title h2{font-family:var(--f-display);font-size:1.4rem;margin:0}
.fgroup{display:grid;gap:4px}
.fgroup .lb{font-size:.8rem;color:var(--muted);font-weight:600}
.hsum{display:grid;gap:8px;padding:12px;border-radius:10px;background:var(--sunk)}
.hstats{display:flex;flex-wrap:wrap;gap:6px 16px}
.hstats div{display:grid}
.hstats b{font-family:var(--f-mono);font-size:1.15rem;font-weight:500}
.hstats span{font-size:.8rem;color:var(--muted)}
.hmonth{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;padding:10px 2px 2px;border-bottom:1px solid var(--line)}
.hrow{display:grid;grid-template-columns:3rem 1fr;gap:12px;border:none;border-bottom:1px solid var(--line);background:none;padding:10px 2px;text-align:left;width:100%;align-items:start}
.hrow:hover{background:var(--sunk)}
.hrow .hd{display:grid;justify-items:center;line-height:1.1}
.hrow .hd b{font-family:var(--f-mono);font-size:1.35rem;font-weight:500}
.hrow .hd small{color:var(--muted);font-size:.75rem}
.hrow .hb{display:grid;gap:4px;min-width:0}
.fcs{display:flex;flex-wrap:wrap;gap:5px}
.fc{display:inline-flex;gap:5px;align-items:baseline;background:var(--sunk);border-radius:6px;padding:.1rem .5rem;font-size:.9rem}
.fc .k{font-size:.75rem;color:var(--muted)}
.fc.ok{background:color-mix(in srgb,var(--ok) 12%,var(--surface));color:var(--ok)}
.fc.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.fc.bad{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad);font-weight:600}
.dtable{width:100%;border-collapse:collapse;font-size:.9rem}
.dtable th,.dtable td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
.dtable th{font-size:.75rem;color:var(--muted);font-weight:600}
.dtable td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head h2{font-family:var(--f-display);font-size:1.35rem;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:.8rem;text-align:center;color:var(--muted);font-weight:600;padding-bottom:2px}
.cal .wd.sun{color:var(--bad)} .cal .wd.sat{color:var(--accent)}
.day{min-height:4.6rem;border:1.5px solid transparent;border-radius:10px;background:var(--sunk);padding:5px 4px;display:grid;grid-template-rows:auto 1fr;text-align:left;min-width:0;align-content:start;gap:3px}
.day.out{background:transparent;opacity:.4}
.day .n{font-family:var(--f-mono);font-size:.9rem;font-weight:500;line-height:1.4;padding:0 4px;justify-self:start;border-radius:6px}
.day.sun .n{color:var(--bad)} .day.sat .n{color:var(--accent)}
.day.today .n{background:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.day .marks{display:flex;flex-wrap:wrap;gap:1px 2px;align-content:flex-start;font-size:.95rem;line-height:1.15}
.day .marks .dot{width:.55rem;height:.55rem;border-radius:50%;margin:2px 1px}
.day .marks .more{font-size:.7rem;color:var(--muted);font-family:var(--f-mono);align-self:center}
@media(max-width:420px){.day{min-height:3.9rem}.day .marks{font-size:.8rem}}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px;font-size:.85rem;color:var(--muted)}
.legend span,.legend button{display:inline-flex;align-items:center;gap:4px}
.legend button{border:1px solid transparent;background:none;border-radius:999px;padding:.15rem .5rem;color:var(--muted)}
.legend button:hover{border-color:var(--line)}
.legend button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.filterbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--sunk);border-radius:10px;padding:8px 10px}

/* water heatmap */
.hm-wrap{overflow-x:auto;padding-bottom:4px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:1.1rem repeat(7,var(--cell));grid-auto-columns:var(--cell);gap:3px;width:max-content}
.hm .ml{font-size:.7rem;color:var(--muted);white-space:nowrap;width:0;overflow:visible;line-height:1.1rem}
.hm .wl{font-size:.7rem;color:var(--muted);display:grid;place-items:center}
.hc{border:none;padding:0;border-radius:3px;background:var(--none);position:relative}
.hc.ok{background:var(--ok)} .hc.warn{background:var(--warn)} .hc.bad{background:var(--bad)}
.hc.blank{background:transparent}
.hc.today{outline:2px solid var(--ink);outline-offset:1px}
.hc .wc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42%;height:42%;border-radius:50%;background:var(--surface);border:1.5px solid var(--ink)}
.lg{display:inline-block;width:.75rem;height:.75rem;border-radius:3px;position:relative}
.lg.wcl{width:.65rem;height:.65rem;border-radius:50%;background:var(--surface);border:1.5px solid var(--ink)}
.chart-box{overflow-x:auto}
.chart-box svg{display:block;width:100%;min-width:300px;height:auto}
.chart-box text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.st{font-size:.8rem;font-weight:600}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.bad{color:var(--bad)}

/* photos */
.hero-photo{display:block;width:100%;padding:0;border:none;border-radius:10px;overflow:hidden;position:relative;background:var(--sunk)}
.hero-photo img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;max-width:100%}
.hero-photo span{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:.8rem;padding:2px 8px;border-radius:6px}
.gal-month{font-size:.9rem;font-weight:600;color:var(--muted);margin:4px 0 -4px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(7rem,1fr));gap:6px}
.gal{position:relative;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:var(--sunk);text-align:left}
.gal img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;max-width:100%}
.gal .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;font-size:.72rem;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));display:flex;justify-content:space-between;gap:4px}
.gal .num{position:absolute;top:6px;right:6px;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.gal[aria-pressed="true"]{border-color:var(--accent)}
.cmp{position:relative;width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#000;touch-action:pan-y}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .b{clip-path:inset(0 0 0 var(--x,50%))}
.cmp .line{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.5);pointer-events:none}
.cmp .tag{position:absolute;top:8px;background:rgba(0,0,0,.6);color:#fff;font-size:.8rem;padding:2px 8px;border-radius:6px}
.cmp-side{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cmp-side figure{margin:0;display:grid;gap:4px}
.cmp-side img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;max-width:100%}
.cmp-side figcaption{font-size:.8rem;color:var(--muted)}
input[type="range"]{width:100%;accent-color:var(--accent)}
.lightbox img{width:100%;height:auto;border-radius:10px}

/* reminders */
.rem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rem .when{font-size:.85rem;font-weight:600;border-radius:7px;padding:.3rem .5rem;text-align:center;min-width:4.4rem;background:var(--sunk)}
.rem .when.over{background:var(--bad);color:#fff}
.rem .when.today{background:var(--warn);color:#fff}
.rem .info{min-width:0;display:grid;gap:1px}
.rem .info b{font-weight:600;overflow-wrap:anywhere}
.rem .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rem.off{opacity:.55}
@media(max-width:460px){.rem{grid-template-columns:auto 1fr}.rem .acts{grid-column:1/-1;justify-content:flex-start}}

/* sortable lists & settings */
.olist{display:grid;gap:6px}
.oitem{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 4px;background:var(--bg);transition:transform .15s ease}
.olist.sorting .oitem{transition:transform .15s ease}
.oitem.dragging{transition:none;z-index:5;box-shadow:0 10px 24px rgba(0,0,0,.2);background:var(--surface);position:relative}
.oitem.off>.lbl{opacity:.45}
.oitem>.lbl{display:flex;gap:8px;align-items:center;min-width:0;flex-wrap:wrap}
.oitem>.ctl{display:flex;gap:6px;align-items:center}
.oitem>.panel{grid-column:1/-1;display:grid;gap:10px;padding:8px 6px 4px 8px;border-top:1px dashed var(--line);margin-top:2px}
.handle{touch-action:none;cursor:grab;width:2rem;height:2.2rem;display:grid;place-items:center;color:var(--muted);border-radius:7px;flex:none;border:none;background:none;font-size:1.15rem;line-height:1;user-select:none;-webkit-user-select:none}
.handle:active{cursor:grabbing}
.kind{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 .35rem}
.sw-toggle{position:relative;width:2.6rem;height:1.5rem;border-radius:999px;border:none;background:var(--line);padding:0;flex:none}
.sw-toggle::after{content:"";position:absolute;top:3px;left:3px;width:calc(1.5rem - 6px);height:calc(1.5rem - 6px);border-radius:50%;background:var(--surface);transition:left .15s}
.sw-toggle[aria-checked="true"]{background:var(--accent)}
.sw-toggle[aria-checked="true"]::after{left:calc(100% - 1.5rem + 3px)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.setrow .t{display:grid;min-width:0;flex:1 1 14rem}
.setrow .t small{color:var(--muted);font-size:.85rem}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{border:2px solid var(--line);border-radius:12px;padding:6px 10px 6px 6px;background:var(--surface);display:inline-flex;gap:8px;align-items:center;font-size:.9rem}
.swatch[aria-pressed="true"]{border-color:var(--ink);font-weight:600}

function heatBlock(t, from, compact){
  const S = settings, t0 = today();
  const lead = (parse(from).getDay() - S.weekStart + 7) % 7, gs = addDays(from, -lead);
  const weeks = Math.ceil((diffDays(t0, gs) + 1) / 7), cell = weeks <= 6 ? 30 : weeks <= 14 ? 20 : 14;
  const by = {}, wc = {};
  state.logs.forEach(l => { if (l.tankId !== t.id || l.date < from) return; if (l.type === "water") by[l.date] = worst([by[l.date], recordStatus(l)]); if (isChange(l)) wc[l.date] = true; });
  let g = `<span class="ml"></span>` + [...Array(7)].map((_,i) => { const wd = (i + S.weekStart) % 7; return `<span class="wl">${wd % 2 === 1 ? WD[wd] : ""}</span>`; }).join("");
  for (let w = 0; w < weeks; w++) {
    const wsd = addDays(gs, w*7);
    let ml = ""; for (let i = 0; i < 7; i++) { const d = parse(addDays(wsd, i)); if (d.getDate() === 1 || (w === 0 && i === lead)) { ml = `${d.getMonth()+1}월`; break; } }
    g += `<span class="ml">${ml}</span>`;

      if (d < from || d > t0) { g += `<span class="hc blank"></span>`; continue; }
      g += `<button class="hc ${by[d]||""} ${d===t0?"today":""}" data-goday="${d}" title="${fmtDay(d)} · ${by[d]?ST_LABEL[by[d]]:"물 상태 기록 없음"}${wc[d]?" · 환수":""}" aria-label="${fmtDay(d)} ${by[d]?ST_LABEL[by[d]]:"기록 없음"}${wc[d]?", 환수":""}">${wc[d]?`<span class="wc"></span>`:""}</button>`; }
  }
  const cnt = {ok:0,warn:0,bad:0}; Object.values(by).forEach(v => cnt[v]++);
  const last = lastOf(t.id, "water");
  return `<div style="display:grid;gap:8px">${compact ? "" : `<div class="row between"><b>${esc(tankLabel(t.id))}</b><span class="small muted">좋음 ${cnt.ok} · 주의 ${cnt.warn} · 나쁨 ${cnt.bad} · 환수 ${Object.keys(wc).length}회</span></div>`}
    ${compact ? `<span class="small muted">좋음 ${cnt.ok} · 주의 ${cnt.warn} · 나쁨 ${cnt.bad} · 환수 ${Object.keys(wc).length}회</span>` : ""}

    ${last && !compact ? `<div class="pills"><button class="pill ${recordStatus(last)||""}" data-act="qe" data-type="water" data-tank-id="${esc(t.id)}" style="background:none;cursor:pointer">${esc(summary(last) || "확인함")} ✎</button><span class="muted small" style="align-self:center">${ago(last.date)}</span></div>` : ""}</div>`;
}

function drawChart(){

function chartSVG(p, tanks, range){
  const minDate = range ? addDays(today(), -range) : "0000-00-00";
  const series = tanks.map(t => ({t, pts: state.logs.filter(l => l.tankId === t.id && l.type === "water" && num(l[p.k]) != null && l.date >= minDate).map(l => ({d:l.date, v:num(l[p.k])})).reverse()}));
  const all = series.flatMap(s => s.pts);
  if (!all.length) return `<div class="empty">이 기간에 ${esc(p.label)} 측정 기록이 없어요.</div>`;
  const W = 640, H = 230, L = 44, R = 14, Tp = 14, B = 30;
  let d0 = range ? minDate : all.reduce((a,b) => a < b.d ? a : b.d, all[0].d); if (!range && diffDays(today(), d0) < 14) d0 = addDays(today(), -14); const span = Math.max(1, diffDays(today(), d0));
  let lo = Math.min(p.ok[0], ...all.map(x => x.v)), hi = Math.max(p.ok[1], ...all.map(x => x.v));
  if (hi === lo) hi = lo + 1; const pv = (hi - lo) * .12; lo = Math.max(0, lo - pv); hi += pv;
  const X = d => L + (W - L - R) * diffDays(d, d0) / span, Y = v => Tp + (H - Tp - B) * (1 - (v - lo) / (hi - lo));
  const dec = (hi - lo) < 2 ? 2 : (hi - lo) < 20 ? 1 : 0;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.label)} 추이"><rect x="${L}" y="${Y(p.ok[1])}" width="${W-L-R}" height="${Math.max(1, Y(p.ok[0]) - Y(p.ok[1]))}" fill="var(--ok)" fill-opacity=".12"/>`;
  for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; s += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v.toFixed(dec)}</text>`; }
  [0,.5,1].forEach((f,i) => { const d = addDays(d0, Math.round(span*f)); s += `<text x="${X(d)}" y="${H-8}" text-anchor="${["start","middle","end"][i]}">${d.slice(5).replace("-","/")}</text>`; });
  series.forEach(se => { if (!se.pts.length) return; const c = tankColor(se.t.id);
    if (se.pts.length > 1) s += `<polyline fill="none" stroke="${c}" stroke-width="2" points="${se.pts.map(x => `${X(x.d).toFixed(1)},${Y(x.v).toFixed(1)}`).join(" ")}"/>`;
    se.pts.forEach((x,i) => { const last = i === se.pts.length-1; s += `<circle cx="${X(x.d).toFixed(1)}" cy="${Y(x.v).toFixed(1)}" r="${last?4.5:2.8}" fill="${last?c:"var(--surface)"}" stroke="${c}" stroke-width="1.8"><title>${esc(se.t.name)} ${x.d} · ${x.v}${p.unit}</title></circle>`; }); });
  return s + `</svg>`;
}

/* ================= drag & drop sorting ================= */
function bindSortables(root){
  root.querySelectorAll("[data-sort]").forEach(list => {
    if (list.dataset.bound) return; list.dataset.bound = "1";
    list.addEventListener("pointerdown", e => {
      const h = e.target.closest(".handle"); if (!h) return;
      const item = h.closest("[data-idx]"); if (!item || item.parentElement !== list) return;
      e.preventDefault(); startDrag(e, list, item);
    });
    list.addEventListener("keydown", e => {
      if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
      const h = e.target.closest(".handle"); if (!h) return;
      const item = h.closest("[data-idx]"); if (!item || item.parentElement !== list) return;
      e.preventDefault();
      const from = Number(item.dataset.idx), to = from + (e.key === "ArrowUp" ? -1 : 1);
      if (to < 0 || to >= list.children.length) return;
      reorder(list.dataset.sort, from, to);
      requestAnimationFrame(() => { const nl = document.querySelector(`[data-sort="${CSS.escape(list.dataset.sort)}"]`); nl?.children[to]?.querySelector(".handle")?.focus(); });
    });
  });
}
function startDrag(e, list, item){
  const items = [...list.children].filter(c => c.dataset.idx != null);
  const from = items.indexOf(item); if (from < 0) return;
  const rects = items.map(i => i.getBoundingClientRect());
  const gap = items.length > 1 ? Math.max(0, rects[1].top - rects[0].bottom) : 0, hgt = rects[from].height + gap;
  const startY = e.clientY; let to = from;
  item.classList.add("dragging"); list.classList.add("sorting");
  try { item.setPointerCapture(e.pointerId); } catch {}
  const move = ev => {
    const dy = ev.clientY - startY; item.style.transform = `translateY(${dy}px)`;
    const mid = rects[from].top + rects[from].height / 2 + dy;
    to = items.filter((_, i) => i !== from && rects[i].top + rects[i].height / 2 < mid).length;
    items.forEach((it, i) => { if (i === from) return; let s = 0; if (from < to && i > from && i <= to) s = -hgt; if (from > to && i < from && i >= to) s = hgt; it.style.transform = s ? `translateY(${s}px)` : ""; });
  };
  const end = () => {
    item.removeEventListener("pointermove", move); item.removeEventListener("pointerup", end); item.removeEventListener("pointercancel", end);
    items.forEach(it => it.style.transform = ""); item.classList.remove("dragging"); list.classList.remove("sorting");
    if (to !== from) reorder(list.dataset.sort, from, to);
  };
  item.addEventListener("pointermove", move); item.addEventListener("pointerup", end); item.addEventListener("pointercancel", end);
}
function reorder(key, from, to){
  if (key === "tanks") { moveTank(from, to); return; }
  const arr = listRef(key); if (!arr) return;
  const [x] = arr.splice(from, 1); arr.splice(to, 0, x);
  saveSettings();
}
async function moveTank(from, to){
  const arr = [...state.tanks]; const [x] = arr.splice(from, 1); arr.splice(to, 0, x);
  state.tanks = arr.map((t, k) => ({...t, order:k})); render();
  for (const t of state.tanks) await dbUpdate("tanks", t.id, {order:t.order});
}

function collectFields(type, form, v){

  fieldsOf(type).forEach(f => {
    if (!form.querySelector(`[data-fk="${f.k}"]`)) { if (v.type === type && hasVal(v[f.k])) rec[f.k] = v[f.k]; return; }
    if (f.kind === "single") rec[f.k] = g(f.k);
    else if (f.kind === "multi") rec[f.k] = fd.getAll(f.k).map(String);
    else if (f.kind === "scale5" || f.kind === "num") rec[f.k] = num(g(f.k));
    else if (f.kind === "pct") rec[f.k] = num(g(`${f.k}_c`)) ?? num(g(f.k));
    else rec[f.k] = g(f.k);
  });
  if (type === "water") PARAMS.forEach(p => { if (form.querySelector(`#${p.k}`)) { const n = num(g(p.k)); if (n != null) rec[p.k] = n; } else if (v.type === "water" && num(v[p.k]) != null) rec[p.k] = v[p.k]; });
  if (type === "clean" && hasVal(rec.pct)) { const tf = fieldOf("clean","tasks"), wcv = optByRole(tf, "wc"); if (wcv && Array.isArray(rec.tasks) && !rec.tasks.includes(wcv)) rec.tasks.unshift(wcv); }
  return rec;
}
const BASE_KEYS = ["tankId","date","time","memo","photos","created","src"];
function convertRecord(l, newType){
  if (l.type === newType) return {...l};
  const out = {type:newType};
  BASE_KEYS.forEach(k => { if (hasVal(l[k])) out[k] = l[k]; });
  if (l.id) out.id = l.id;
  const nf = fieldsOf(newType), lost = [];
  const used = new Set();
  if (newType === "dose" && !hasVal(l.products)) { const p = l.product || l.food; if (hasVal(p)) { out.products = splitNames(p); used.add(l.product ? "product" : "food"); } if (/약품|첨가제/.test(l.category || "")) used.add("category"); }
  if (l.type === "dose" && newType === "maint" && hasVal(l.products)) { out.product = l.products.join(", "); used.add("products"); }
  fieldsOf(l.type).forEach(f => {
    if (!hasVal(l[f.k]) || used.has(f.k)) return;
    const t = nf.find(x => x.k === f.k);
    if (t && (t.kind === f.kind || (t.kind === "text" && f.kind !== "multi"))) out[f.k] = l[f.k];
    else lost.push(fieldText({...f, sum:"label"}, l[f.k], l));
  });
  if (l.type === "water") PARAMS.forEach(p => { if (num(l[p.k]) != null) { if (newType === "water") out[p.k] = l[p.k]; else lost.push(`${p.label} ${l[p.k]}`); } });
  const lostTxt = lost.filter(Boolean).join(" · ");
  out._lost = lostTxt ? `[${typeOf(l.type).label}] ${lostTxt}` : "";
  if (out._lost) out.memo = [l.memo, out._lost].filter(Boolean).join("\n");
  return out;
}

async function renameAcross(tankId, keys, oldV, newV, splitField){
  const hits = state.logs.filter(l => l.tankId === tankId && keys.some(k => splitField === k ? splitNames(l[k]).includes(oldV) : String(l[k] ?? "").trim() === oldV));
  for (const l of hits) {
    const patch = {};
    keys.forEach(k => { if (splitField === k) { const ns = splitNames(l[k]); if (ns.includes(oldV)) patch[k] = ns.map(x => x === oldV ? newV : x).join(", "); } else if (String(l[k] ?? "").trim() === oldV) patch[k] = newV; });
    await dbUpdate("logs", l.id, patch);
  }
  return hits.length;
}

    case "confirm-no": state.confirm = ""; render(); break;
    case "reset-yes": settings = normalize(null); state.confirm = ""; saveSettings(); toast("설정을 초기화했어요"); break;
    case "te-open": state.editType = b.dataset.type; state.editField = ""; state.confirm = ""; go("typeEdit"); break;
    case "te-on": { const t = settings.types.find(x => x.k === state.editType); if (t) { t.on = !t.on; if (!settings.types.some(x => x.on)) t.on = true; saveSettings(); } break; }
    case "te-emoji": { const t = settings.types.find(x => x.k === state.editType); if (t) { t.emoji = b.dataset.e; saveSettings(); } break; }
    case "fe-open": state.editField = state.editField === b.dataset.fk ? "" : b.dataset.fk; state.confirm = ""; render(); break;
    case "opt-del": { const f = fieldOf(state.editType, b.dataset.fk); if (f?.options) { const [gone] = f.options.splice(Number(b.dataset.i), 1); saveSettings(); toast(`'${gone.v}' 선택지를 지웠어요`, "되돌리기", () => { f.options.splice(Number(b.dataset.i), 0, gone); saveSettings(); }); } break; }
    case "opt-add": { const f = fieldOf(state.editType, b.dataset.fk), inpEl = $(`#optNew-${b.dataset.fk}`), val = (inpEl?.value || "").trim(); if (!f || !val) break; if (f.options.some(x => x.v === val)) { toast("이미 있는 선택지예요"); break; } if (f.kind === "pct" && num(val) == null) { toast("숫자로 입력해 주세요"); break; } f.options.push({v:val, st:""}); saveSettings(); requestAnimationFrame(() => $(`#optNew-${b.dataset.fk}`)?.focus()); break; }
    case "field-add": { const name = ($("#newFieldName")?.value || "").trim(), kind = $("#newFieldKind")?.value || "text"; if (!name) { toast("항목 이름을 입력해 주세요"); break; } const k = rid("cf_"); settings.fields[state.editType].push({k, label:name, kind, on:true, custom:true, ...(kind === "single" || kind === "multi" ? {options:[]} : {})}); state.editField = k; saveSettings(); break; }
    case "field-del-ask": state.confirm = `field:${b.dataset.fk}`; render(); break;
    case "field-del-yes": settings.fields[state.editType] = fieldsOf(state.editType).filter(f => f.k !== b.dataset.fk); state.confirm = ""; state.editField = ""; saveSettings(); break;
    case "type-add": { const k = rid("ct_"); settings.types.push({k, on:true, emoji:"⭐", color:TANK_DEFAULT_COLORS[settings.types.length % TANK_DEFAULT_COLORS.length], label:"새 기록", custom:true}); settings.fields[k] = []; state.editType = k; state.editField = ""; saveSettings(false); go("typeEdit"); break; }
    case "type-del-ask": state.confirm = "type"; render(); break;
    case "type-del-yes": deleteType(state.editType); break;
    case "ai-auto": settings.aiAuto = !settings.aiAuto; saveSettings(); break;
    case "ai-review": openAIReview(tid); break;
    case "param-info": openParamInfo(b.dataset.k, b.dataset.tankId); break;
    case "restore": restoreBackup(); break;
    case "logout": if (state.confirm !== "logout") { state.confirm = "logout"; toast("한 번 더 누르면 이 기기에서 로그아웃해요"); setTimeout(() => { if (state.confirm === "logout") state.confirm = ""; }, 4000); } else { try { [(window.FISH_LS + "settings"),(window.FISH_LS + "view"),(window.FISH_LS + "tank")].forEach(k => localStorage.removeItem(k)); } catch {} PN.logout(); } break;
    case "ics": if (!state.reminders.some(r => r.enabled !== false)) toast("켜진 알림이 없어요"); else saveFile("어항알림.ics", buildICS(), "text/calendar"); break;
    case "backup": saveFile(`어항일지-백업-${today()}.json`, JSON.stringify({exported:new Date().toISOString(), settings, tanks:state.tanks, reminders:state.reminders, logs:state.logs}, null, 2), "application/json"); break;
  }
});
document.addEventListener("input", e => { if (e.target.id === "logSearch") { state.logQuery = e.target.value; clearTimeout(state.qt); state.qt = setTimeout(queueRender, 200); } });
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.closest("#sheetRoot")) return;
  if (t.id === "rangeSel") { state.range = Number(t.value); render(); return; }
  if (t.id === "waterFrom") { settings.waterFrom = t.value; saveSettings(); return; }
  if (t.dataset.set) { const k = t.dataset.set; settings[k] = (k === "fontScale" || k === "weekStart") ? Number(t.value) : t.value; saveSettings(); return; }
  if (t.id === "accentPick") { settings.accent = t.value; saveSettings(); return; }
  if (t.dataset.paramOn) { settings.params[t.dataset.paramOn] = t.checked; saveSettings(false); return; }
  if (t.id === "bulkType" && t.value) { const nt = t.value, list = state.logs.filter(l => state.sel.has(l.id)); let n = 0; for (const l of list) { const nr = convertRecord(l, nt); const {id, _lost, ...rest} = nr; if (await dbSet("logs", l.id, rest)) n++; } state.selecting = false; state.sel = new Set(); render(); toast(`${n}건을 ${typeOf(nt).label}(으)로 바꿨어요`); return; }
  if (t.id === "bulkTank" && t.value) { const list = state.logs.filter(l => state.sel.has(l.id)); let n = 0; for (const l of list) if (await dbUpdate("logs", l.id, {tankId:t.value})) n++; state.selecting = false; state.sel = new Set(); render(); toast(`${n}건을 ${tankName(t.value)}(으)로 옮겼어요`); return; }
  if (t.dataset.te) { const ty = settings.types.find(x => x.k === state.editType); if (!ty) return; const val = t.value.trim(); if (t.dataset.te === "label") { if (val) ty.label = val; else delete ty.label; } else if (t.dataset.te === "emoji") ty.emoji = val || typeOf(ty.k).emoji; else ty.color = t.value; saveSettings(); return; }
  if (t.dataset.fe) { const f = fieldOf(state.editType, t.dataset.fk); if (!f) return; if (t.dataset.fe === "label") f.label = t.value.trim() || f.label; else f.unit = t.value.trim(); saveSettings(); return; }
  if (t.dataset.ov != null) { const f = fieldOf(state.editType, t.dataset.fk), op = f?.options?.[Number(t.dataset.ov)]; if (!op) return; const nv = t.value.trim(), old = op.v;
    if (!nv || nv === old) { t.value = old; return; } if (f.options.some(x => x.v === nv)) { t.value = old; toast("이미 있는 선택지예요"); return; } if (f.kind === "pct" && num(nv) == null) { t.value = old; toast("숫자로 입력해 주세요"); return; }
    op.v = nv; saveSettings(); renameOption(state.editType, f.k, old, nv); return; }
  if (t.dataset.oe != null) { const op = fieldOf(state.editType, t.dataset.fk)?.options?.[Number(t.dataset.oe)]; if (op) { op.emoji = t.value.trim(); saveSettings(); } return; }
  if (t.dataset.os != null) { const op = fieldOf(state.editType, t.dataset.fk)?.options?.[Number(t.dataset.os)]; if (op) { op.st = t.value; saveSettings(); } return; }
  if (t.dataset.or != null) { const op = fieldOf(state.editType, t.dataset.fk)?.options?.[Number(t.dataset.or)]; if (op) { if (t.value) op.role = t.value; else delete op.role; saveSettings(); } return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#sheetRoot").innerHTML) closeSheet();
  if (e.key === "Enter" && e.target.id?.startsWith("optNew-")) { e.preventDefault(); document.querySelector(`[data-act="opt-add"][data-fk="${e.target.id.slice(7)}"]`)?.click(); }
  if (e.key === "Enter" && e.target.id === "newFieldName") { e.preventDefault(); document.querySelector('[data-act="field-add"]')?.click(); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) queueRender(); });

try { const v = localStorage.getItem((window.FISH_LS + "view")); if (v && TAB_DEFS.some(t => t.k === v) || v === "settings") state.view = v; const t = localStorage.getItem((window.FISH_LS + "tank")); if (t) state.tank = t; } catch {}
applyTheme();
navInit();
render();
connect();
initAI();
})();
</script>
